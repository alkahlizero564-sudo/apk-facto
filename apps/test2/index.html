<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة بسيطة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* خلفية جمالية بتأثيرات ضوئية */
        .glow-circle {
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(99, 102, 241, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            animation: pulse 6s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        .card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 50px 40px;
            text-align: center;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4),
                        0 0 0 1px rgba(255, 255, 255, 0.05);
            z-index: 1;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        .title {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 12px;
            color: #ffffff;
            letter-spacing: -0.5px;
            background: linear-gradient(to left, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 36px;
            line-height: 1.6;
        }

        .btn-action {
            position: relative;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #ffffff;
            border: none;
            padding: 16px 42px;
            font-size: 1.15rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4),
                        0 8px 10px -6px rgba(79, 70, 229, 0.2);
            outline: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 240px;
        }

        .btn-action:hover {
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 15px 30px -5px rgba(79, 70, 229, 0.6);
        }

        .btn-action:active {
            transform: translateY(1px) scale(0.98);
            box-shadow: 0 5px 15px -3px rgba(79, 70, 229, 0.4);
        }

        /* صندوق الإشعار عند الضغط */
        .toast {
            margin-top: 24px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.95rem;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            padding: 10px 18px;
            border-radius: 12px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            display: inline-block;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="glow-circle"></div>

    <div class="card">
        <h1 class="title">أهلاً بك!</h1>
        <p class="subtitle">صفحة بسيطة وأنيقة مصممة خصيصاً لك</p>
        
        <button class="btn-action" id="mainBtn">
            <span>اضغط هنا</span>
        </button>

        <div id="toastMessage" class="toast">تم النقر بنجاح! شكراً لك ✨</div>
    </div>

    <script>
        const btn = document.getElementById('mainBtn');
        const toast = document.getElementById('toastMessage');
        let timer;

        btn.addEventListener('click', () => {
            // إظهار رسالة تفاعلية لطيفة
            toast.classList.add('show');
            
            clearTimeout(timer);
            timer = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        });
    </script>
</body>
</html>
